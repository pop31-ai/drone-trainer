name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run trainer simulation (physics + AI, all missions/programs)
        run: node test/run_tests.js

  build-brochure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install --quiet matplotlib reportlab pillow

      - name: Generate BPMN diagrams + brochure (PDF/HTML)
        run: |
          python bpmn/gen_brochure.py

      - name: Generate PDF instruction manuals (desktop + tablet)
        run: |
          python bpmn/gen_manual.py

      - name: Syntax check inline JS from index.html
        run: |
          python -c "import re; s=open('index.html',encoding='utf-8').read(); blocks=re.findall(r'<script>(.*?)</script>', s, re.S); open('inline.js','w',encoding='utf-8').write(max(blocks, key=len))"
          node --check inline.js

      - name: Upload brochure artifact
        uses: actions/upload-artifact@v4
        with:
          name: drone-brochure
          path: bpmn/out

  build-screenshot-brochure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps (incl. Playwright chromium for headless screenshots)
        run: |
          pip install --quiet matplotlib reportlab pillow playwright
          python -m playwright install --with-deps chromium

      - name: Serve trainer locally for screenshots
        run: |
          python -m http.server 8123 --bind 127.0.0.1 > /tmp/httpd.log 2>&1 &
          sleep 3

      - name: Capture in-game screenshots (headless WebGL via SwiftShader)
        run: |
          python bpmn/shots.py

      - name: Build screenshot brochure PDF
        run: |
          python bpmn/gen_brochure_shots.py

      - name: Upload screenshot brochure artifact
        uses: actions/upload-artifact@v4
        with:
          name: drone-screenshot-brochure
          path: bpmn/out