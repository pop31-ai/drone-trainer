name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-brochure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install --quiet matplotlib reportlab pillow

      - name: Generate BPMN diagrams + brochure (PDF/HTML)
        run: |
          python bpmn/gen_brochure.py

      - name: Syntax check inline JS from index.html
        run: |
          python -c "import re; s=open('index.html',encoding='utf-8').read(); blocks=re.findall(r'<script>(.*?)</script>', s, re.S); open('inline.js','w',encoding='utf-8').write(max(blocks, key=len))"
          node --check inline.js

      - name: Upload brochure artifact
        uses: actions/upload-artifact@v4
        with:
          name: drone-brochure
          path: bpmn/out